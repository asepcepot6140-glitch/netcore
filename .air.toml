root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/main.exe ./cmd/api"
bin = "./tmp/main.exe"
include_ext = ["go", "env"]
exclude_dir = ["tmp", "vendor", "frontend", "node_modules"]
# Vite ikut dinyalakan saat air jalan dan dimatikan saat air dihentikan (Ctrl+C).
pre_cmd = ["powershell -NoProfile -ExecutionPolicy Bypass -File scripts/vite.ps1 start"]
post_cmd = ["powershell -NoProfile -ExecutionPolicy Bypass -File scripts/vite.ps1 stop"]